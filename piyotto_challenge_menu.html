<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ぴよっとチャレンジ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf8fc;color:#244c57;font-family:system-ui,-apple-system,sans-serif}
main{max-width:520px;margin:auto;padding:12px}
h1{font-size:24px;margin:5px 0 10px;text-align:center;color:#e88d28}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 8px #25586612}
.stat small{display:block;color:#6b8c94;font-size:12px}.stat strong{font-size:24px}
.stage{position:relative;border:3px solid white;border-radius:17px;overflow:hidden;box-shadow:0 4px 14px #2b677322;background:#a4e7f7}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;background:#143c444d;overflow:auto}
.panel{background:#fffffff5;border-radius:18px;padding:14px 13px;text-align:center;width:100%;max-width:365px;max-height:98%;overflow:auto;box-shadow:0 5px 0 #82bac4}
.panel h2{color:#f19a32;margin:0 0 5px;font-size:25px}.panel p{font-size:13px;line-height:1.55;margin:6px 0 10px}
button{border:0;border-radius:999px;padding:11px 17px;background:#ff9e34;color:white;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #d57922}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #d57922}
.hint{text-align:center;font-size:12px;color:#63858c;padding:8px}
.menu-stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0 10px}
.menu-stat{background:#eef8fb;border-radius:10px;padding:7px 3px}
.menu-stat small{font-size:11px;color:#63858c;display:block}.menu-stat strong{font-size:23px}
.image-menu{border:1px solid #d6e9ed;border-radius:12px;padding:9px;margin:8px 0;text-align:left}
.image-menu summary{font-weight:800;cursor:pointer;font-size:13px}
.file-row{margin-top:7px}.file-row label{font-size:12px;display:block;font-weight:700}.file-row input{font-size:12px;max-width:100%;margin-top:3px}
.file-row small{display:block;font-size:10px;color:#718d93;line-height:1.4}
.subbuttons{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:7px}
.subbuttons button{font-size:11px;padding:7px 10px;background:#588e99;box-shadow:0 3px 0 #356a75}
</style>
</head>
<body>
<main>
  <h1>🐾 ぴよっとチャレンジ</h1>
  <div class="stats">
    <div class="stat"><small>現在の連続クリア</small><strong id="streak">0</strong></div>
    <div class="stat"><small>最高連続クリア</small><strong id="best">0</strong></div>
  </div>
  <div class="stage">
    <canvas id="game" width="360" height="520" aria-label="タップしてキャラクターを飛ばすゲーム"></canvas>
    <div class="overlay" id="overlay">
      <div class="panel">
        <h2 id="panelTitle">メニュー画面</h2>
        <p id="panelDesc">土管を30本通過すると1クリア。<br>連続クリア記録に挑戦しよう！</p>
        <div class="menu-stats">
          <div class="menu-stat"><small>現在の連続クリア</small><strong id="menuStreak">0</strong></div>
          <div class="menu-stat"><small>最高連続クリア</small><strong id="menuBest">0</strong></div>
        </div>
        <details class="image-menu" open>
          <summary>🎨 画像選択メニュー</summary>
          <div class="file-row"><label for="charFile">キャラクター画像</label><input id="charFile" type="file" accept="image/*"><small>透過PNGがおすすめ</small></div>
          <div class="file-row"><label for="pipeFile">土管・障害物画像</label><input id="pipeFile" type="file" accept="image/*"><small>上下の障害物に使用</small></div>
          <div class="file-row"><label for="bgFile">背景画像</label><input id="bgFile" type="file" accept="image/*"><small>ゲーム画面全体に表示</small></div>
          <div class="subbuttons"><button id="clearImages">初期画像に戻す</button></div>
        </details>
        <button id="start">挑戦スタート</button>
      </div>
    </div>
  </div>
  <div class="hint">画面をタップ／クリックで上昇 · 土管30本で1クリア</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const W=360,H=520,F=472,GAP=154,PW=57,SPEED=2.35,GRAVITY=.32,FLAP=-5.8;
let state='menu',bird,pipes=[],score=0,streak=0,best=0,frame=0,last=0,ground=0;
let charImg=null,pipeImg=null,bgImg=null;
try{best=Number(localStorage.getItem('piyoChallengeBest')||0)}catch(e){}
function updateStats(){
 $('streak').textContent=streak;$('best').textContent=best;
 $('menuStreak').textContent=streak;$('menuBest').textContent=best;
}
function resetWorld(){bird={x:W*.27,y:H*.43,vy:0,r:14,rot:0};pipes=[];score=0;frame=0;ground=0;for(let i=0;i<3;i++)pipes.push(makePipe(W+90+i*W*.75))}
function makePipe(x){return{x,top:65+Math.random()*155,passed:false}}
function showMenu(title,description,buttonText){
 state='menu';$('panelTitle').textContent=title;$('panelDesc').innerHTML=description;$('start').textContent=buttonText;$('overlay').style.display='flex';updateStats();draw();
}
function startGame(){resetWorld();state='playing';$('overlay').style.display='none';last=performance.now();requestAnimationFrame(loop)}
function finish(){
 if(state!=='playing')return;
 streak=0;updateStats();
 showMenu('ゲームオーバー！','通過した土管：<b>'+score+'</b>本<br>現在の連続クリアは0。最高記録はそのまま！','もう一度挑戦');
}
function win(){
 if(state!=='playing')return;
 streak++;if(streak>best){best=streak;try{localStorage.setItem('piyoChallengeBest',String(best))}catch(e){}}
 updateStats();showMenu('🎉 ステージクリア！','土管30本突破！<br>現在の連続クリア：<b>'+streak+'</b><br>最高記録：<b>'+best+'</b>','次のステージへ');
}
function flap(e){if(e)e.preventDefault();if(state==='playing')bird.vy=FLAP}
canvas.addEventListener('pointerdown',flap);
$('start').addEventListener('click',startGame);
function loadImage(input,which){
 const f=input.files&&input.files[0];if(!f)return;
 if(!f.type.startsWith('image/')){alert('画像ファイルを選んでね。');return}
 const url=URL.createObjectURL(f),img=new Image();
 img.onload=()=>{if(which==='char')charImg=img;if(which==='pipe')pipeImg=img;if(which==='bg')bgImg=img;URL.revokeObjectURL(url);draw()};
 img.onerror=()=>{URL.revokeObjectURL(url);alert('画像を読み込めなかったよ。別の画像を試してね。')};img.src=url;
}
$('charFile').addEventListener('change',()=>loadImage($('charFile'),'char'));
$('pipeFile').addEventListener('change',()=>loadImage($('pipeFile'),'pipe'));
$('bgFile').addEventListener('change',()=>loadImage($('bgFile'),'bg'));
$('clearImages').addEventListener('click',()=>{charImg=pipeImg=bgImg=null;$('charFile').value='';$('pipeFile').value='';$('bgFile').value='';draw()});
function drawBg(){
 if(bgImg){ctx.drawImage(bgImg,0,0,W,H);return}
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7bd7f2');g.addColorStop(.75,'#d9f7ff');g.addColorStop(.751,'#f7e8b3');g.addColorStop(1,'#f7e8b3');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#ffffffb8';[[W*.17,H*.16,1],[W*.72,H*.28,.72]].forEach(([a,b,s])=>{ctx.beginPath();ctx.arc(a,b,14*s,0,7);ctx.arc(a+17*s,b-7*s,18*s,0,7);ctx.arc(a+35*s,b,13*s,0,7);ctx.fill()});
 ctx.fillStyle='#a1e1a0';ctx.beginPath();ctx.moveTo(0,F);for(let x=0;x<=W;x+=8)ctx.lineTo(x,F-25-Math.sin((x+frame*.3)/50)*10);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill()
}
function drawPipe(p){
 const bottom=p.top+GAP;
 if(pipeImg){ctx.save();ctx.translate(p.x+PW/2,0);ctx.scale(1,-1);ctx.drawImage(pipeImg,-PW/2,-p.top,PW,p.top);ctx.restore();ctx.drawImage(pipeImg,p.x,bottom,PW,Math.max(0,F-bottom));return}
 const g=ctx.createLinearGradient(p.x,0,p.x+PW,0);g.addColorStop(0,'#258d54');g.addColorStop(.45,'#72db76');g.addColorStop(1,'#238d53');
 ctx.fillStyle=g;ctx.strokeStyle='#176c45';ctx.lineWidth=2;
 ctx.fillRect(p.x,0,PW,p.top-16);ctx.strokeRect(p.x,0,PW,p.top-16);
 ctx.fillRect(p.x-4,p.top-18,PW+8,20);ctx.strokeRect(p.x-4,p.top-18,PW+8,20);
 ctx.fillRect(p.x,bottom+18,PW,F-bottom-18);ctx.strokeRect(p.x,bottom+18,PW,F-bottom-18);
 ctx.fillRect(p.x-4,bottom,PW+8,20);ctx.strokeRect(p.x-4,bottom,PW+8,20)
}
function drawBird(){
 ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);
 if(charImg){const ratio=charImg.width/charImg.height;let w=38,h=38;if(ratio>1)h=w/ratio;else w=h*ratio;ctx.drawImage(charImg,-w/2,-h/2,w,h)}
 else{ctx.fillStyle='#ffad32';ctx.beginPath();ctx.moveTo(-12,1);ctx.lineTo(-23,-5);ctx.lineTo(-20,8);ctx.fill();ctx.fillStyle='#ffda4d';ctx.strokeStyle='#d28b29';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,16,13,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#fff0a5';ctx.beginPath();ctx.ellipse(-4,5,7,4,Math.sin(frame*.3)*.3,0,7);ctx.fill();ctx.fillStyle='#ff8237';ctx.beginPath();ctx.moveTo(13,-2);ctx.lineTo(24,2);ctx.lineTo(13,6);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(7,-6,5,0,7);ctx.fill();ctx.fillStyle='#233d47';ctx.beginPath();ctx.arc(9,-6,2,0,7);ctx.fill()}
 ctx.restore()
}
function draw(){
 ctx.clearRect(0,0,W,H);drawBg();pipes.forEach(drawPipe);
 if(!bgImg){ctx.fillStyle='#75c85b';ctx.fillRect(0,F,W,7);ctx.fillStyle='#f2c96b';ctx.fillRect(0,F+7,W,H-F-7);ctx.strokeStyle='#d7ac55';for(let x=-(ground%25);x<W;x+=25){ctx.beginPath();ctx.moveTo(x,F+22);ctx.lineTo(x+10,F+22);ctx.stroke()}}
 drawBird();ctx.fillStyle='#fff';ctx.strokeStyle='#3a7887';ctx.lineWidth=3;ctx.font='bold 21px system-ui';ctx.textAlign='center';ctx.strokeText(score+'/30',W/2,32);ctx.fillText(score+'/30',W/2,32)
}
function loop(now){
 if(state!=='playing')return;const dt=Math.min((now-last)/16.67,2);last=now;frame+=dt;ground+=SPEED*dt;
 bird.vy+=GRAVITY*dt;bird.y+=bird.vy*dt;bird.rot=Math.max(-.45,Math.min(1,bird.vy*.075));
 pipes.forEach(p=>{p.x-=SPEED*dt;if(!p.passed&&p.x+PW<bird.x){p.passed=true;score++;if(score>=30){win();return}}});
 if(state!=='playing')return;
 while(pipes.length&&pipes[0].x+PW<0)pipes.shift();if(pipes.length<3)pipes.push(makePipe(pipes[pipes.length-1].x+W*.75));
 if(bird.y-bird.r<0||bird.y+bird.r>F){finish();return}
 for(const p of pipes)if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+PW&&(bird.y-bird.r<p.top||bird.y+bird.r>p.top+GAP)){finish();return}
 draw();requestAnimationFrame(loop)
}
resetWorld();updateStats();showMenu('メニュー画面','土管を30本通過すると1クリア。<br>連続クリア記録に挑戦しよう！','挑戦スタート');
})();
</script>
</body>
</html>
